name: Build DouDuo Vietnamese IPA

on:
  workflow_dispatch:
    inputs:
      translation_mode:
        description: 'Build mode: vietnamese or original (without translation)'
        required: true
        default: vietnamese
        type: choice
        options:
          - vietnamese
          - original

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27.2 and inspect SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks
          python3 --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Apply Vietnamese translation (optional)
        if: ${{ inputs.translation_mode == 'vietnamese' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/vietnamese_patch.py
          test -f scripts/vietnamese_translations.json
          python3 scripts/vietnamese_patch.py

      - name: Download VLC framework
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/fetch-vlckit.sh

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build unsigned DouDuo app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project DouDuo.xcodeproj \
            -scheme DouDuo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/douduo-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Package IPA (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/douduo-derived/Build/Products/Release-iphoneos/DouDuo.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/DouDuo.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/DouDuo-${{ inputs.translation_mode }}-unsigned.ipa" Payload)
          ls -lh "DouDuo-${{ inputs.translation_mode }}-unsigned.ipa"

      - name: Export IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-${{ inputs.translation_mode }}-results
          path: |
            DouDuo-*-unsigned.ipa
            vietnamese-report.txt
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Vietnamese IPA to GitHub Releases
        if: ${{ success() && inputs.translation_mode == 'vietnamese' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IPA="DouDuo-vietnamese-unsigned.ipa"
          test -s "$IPA"
          TAG="douduo-vi-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<EOF
          Bản Việt hóa thử nghiệm, IPA chưa ký để nhập vào LiveContainer. Một số nhãn có thể còn tiếng Trung.

          Mã nguồn: $GITHUB_SHA
          Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --title "DouDuo Vietnamese (build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" \
            --notes-file release-notes.md \
            --prerelease
