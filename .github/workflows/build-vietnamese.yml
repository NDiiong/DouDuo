name: Build DouDuo Vietnamese IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Choose Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Prepare build tools
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Apply Vietnamese interface translations
        run: |
          python3 scripts/vietnamese_patch.py

      - name: Fetch VLC dependency
        run: |
          sh scripts/fetch-vlckit.sh

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/douduo-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/douduo-derived/Build/Products/Release-iphoneos/DouDuo.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/DouDuo.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/DouDuo-Vietnamese-unsigned.ipa" Payload)

      - name: Upload IPA and translation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-Vietnamese-results
          path: |
            DouDuo-Vietnamese-unsigned.ipa
            vietnamese-report.txt
          if-no-files-found: warn
