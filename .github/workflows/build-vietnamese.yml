name: Build DouDuo Vietnamese IPA

on:
  workflow_dispatch:
    inputs:
      translation_mode:
        description: 'Build mode: vietnamese or original (without translation)'
        required: true
        default: vietnamese
        type: choice
        options:
          - vietnamese
          - original

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ${{ inputs.translation_mode == 'original' && 'upstream' || '.' }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned upstream
        if: ${{ inputs.translation_mode == 'original' }}
        uses: actions/checkout@v4
        with:
          repository: 81199000/DouDuo
          ref: 2bd2b2c8c16b6b2848c5266e109e051343d1fe05
          path: upstream
          persist-credentials: false

      - name: Select Xcode 27.2 and inspect SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          fi
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          test "$(printf '%s\n' "$version" | head -n 1)" = "Xcode 27.2"
          xcodebuild -showsdks
          python3 --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Apply Vietnamese translation (optional)
        if: ${{ inputs.translation_mode == 'vietnamese' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/vietnamese_patch.py
          test -f scripts/vietnamese_translations.json
          python3 scripts/vietnamese_patch.py

      - name: Download VLC framework
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/fetch-vlckit.sh

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build unsigned DouDuo app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DouDuo.xcodeproj \
            -scheme DouDuo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/douduo-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package IPA (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/douduo-derived/Build/Products/Release-iphoneos/DouDuo.app"
          python3 scripts/package_unsigned.py "$APP" "$GITHUB_WORKSPACE/delivery" 2>&1 | tee "$GITHUB_WORKSPACE/package.log"

      - name: Export IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-${{ inputs.translation_mode }}-results
          path: |
            delivery/*.ipa
            delivery/*.ipa.sha256
            package.log
            vietnamese-report.txt
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Vietnamese IPA to GitHub Releases
        if: ${{ success() && inputs.translation_mode == 'vietnamese' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set -- delivery/*-unsigned.ipa
          test "$#" -eq 1
          IPA="$1"
          test -s "$IPA"
          test -s "$IPA.sha256"
          TAG="douduo-vi-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<EOF
          Bản Việt hóa thử nghiệm, IPA chưa ký để nhập vào LiveContainer. Một số nhãn có thể còn tiếng Trung.

          Mã nguồn: $GITHUB_SHA
          Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$TAG" "$IPA" "$IPA.sha256" \
            --target "$GITHUB_SHA" \
            --title "DouDuo Vietnamese (build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" \
            --notes-file release-notes.md \
            --prerelease
